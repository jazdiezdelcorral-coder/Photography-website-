<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Album</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="photos" class="solid-header">
  <header class="site-header"></header>

  <main class="page">
    <section class="page-head">
      <p class="eyebrow"><a href="photos.html">Photos</a> / <a href="personal.html">Personal</a> / <span id="album-num"></span></p>
      <h1 id="album-title">Album</h1>
      <p class="lede" id="album-blurb"></p>
      <p class="meta" id="album-count"></p>
    </section>
    <section class="section">
      <div class="gallery" id="album-photos"></div>
      <nav class="album-nav" id="album-nav"></nav>
    </section>
  </main>
  <footer class="site-footer"></footer>
  <div class="lightbox" hidden>
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" aria-label="Previous photo">&#8249;</button>
    <figure><img alt=""><figcaption></figcaption></figure>
    <button class="lb-next" aria-label="Next photo">&#8250;</button>
  </div>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
